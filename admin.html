<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>لوحة التحكم · Basem Madian Books</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Reem+Kufi:wght@500;700&family=IBM+Plex+Sans+Arabic:wght@400;500;600&display=swap">
<link rel="stylesheet" href="assets/style.css">
<style>
.adm{padding-block:28px 80px}
.adm h1{font-size:clamp(24px,3.4vw,34px)}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:22px;display:grid;gap:16px;max-width:720px}
.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin:18px 0 22px}
.admgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:20px}
.admcard{background:none;border:0;padding:0;text-align:right;color:var(--fg);display:grid;gap:8px;cursor:pointer;min-width:0}
.admcard h3{font-family:var(--body);font-size:15px;font-weight:600;overflow-wrap:anywhere}
.admcard .meta{font-size:13px;color:var(--muted)}
.admcard:hover .cover{transform:translateY(-3px)}
.savebar{position:fixed;inset:auto 0 0 0;z-index:8;background:var(--warn);color:#fff;padding-bottom:env(safe-area-inset-bottom,0px)}
.savebar .wrap{display:flex;gap:12px;align-items:center;justify-content:space-between;padding-block:10px;flex-wrap:wrap}
.savebar .btn{background:#fff;color:#000}
.log{font-size:14px;display:grid;gap:4px;max-height:50vh;overflow:auto;direction:rtl}
.log .ok{color:var(--ok)} .log .er{color:var(--warn)}
details.help{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 18px;margin-top:28px;max-width:820px}
details.help summary{cursor:pointer;font-weight:600}
details.help ol{padding-inline-start:20px;display:grid;gap:6px}
code{background:var(--sunk);padding:1px 6px;border-radius:6px;font-size:.9em}
</style>
</head>
<body>
<header class="top"><div class="wrap"><a class="brand" href="./"><span class="mark"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round"><path d="M4 10v4M8 6v12M12 3v18M16 7v10M20 10v4"/></svg></span>لوحة التحكم</a><nav><a href="./" target="_blank" rel="noopener">عرض الموقع ↗</a></nav></div></header>
<main class="adm"><div class="wrap" id="root"></div></main>
<script src="assets/qrcode.js"></script>
<script src="assets/admin.js"></script>
</body>
</html>
